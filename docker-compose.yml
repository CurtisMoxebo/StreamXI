services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamxi-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - streamxi-network

networks:
  streamxi-network:
    driver: bridge
