<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.5" />

  <!-- Outer Football Sphere / Boundary with Tech Arcs -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1e293b" stroke-width="1.8" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#neonGrad)" stroke-width="1.8" stroke-dasharray="24 6 12 6" filter="url(#glow)" />

  <!-- Central Football Pentagon (AI Core Node) -->
  <!-- Center is at (32, 32), radius ~9.5 -->
  <!-- Pentagon angles: -90, -18, 54, 126, 198 -->
  <!-- P1: (32, 22.5), P2: (41, 29), P3: (37.6, 39.7), P4: (26.4, 39.7), P5: (23, 29) -->
  <polygon points="32,22.5 41,29 37.6,39.7 26.4,39.7 23,29" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="2" filter="url(#glow)" />

  <!-- Neural Seams / Circuit Pathways connecting Central Pentagon to Outer Ring -->
  <!-- Top: (32, 22.5) -> (32, 10) -->
  <line x1="32" y1="22.5" x2="32" y2="10" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" />
  <!-- Top Right: (41, 29) -> (51.5, 23.5) -->
  <line x1="41" y1="29" x2="51.5" y2="23.5" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Right: (37.6, 39.7) -> (47.5, 45) -->
  <line x1="37.6" y1="39.7" x2="47.5" y2="45" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Left: (26.4, 39.7) -> (16.5, 45) -->
  <line x1="26.4" y1="39.7" x2="16.5" y2="45" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" />
  <!-- Top Left: (23, 29) -> (12.5, 23.5) -->
  <line x1="23" y1="29" x2="12.5" y2="23.5" stroke="url(#neonGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Secondary Hexagon Nodes along outer perimeter -->
  <line x1="32" y1="10" x2="44" y2="13" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="10" x2="20" y2="13" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="51.5" y1="23.5" x2="54" y2="34" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="12.5" y1="23.5" x2="10" y2="34" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="47.5" y1="45" x2="37" y2="52" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16.5" y1="45" x2="27" y2="52" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />

  <!-- AI Neural Dots / Vertex Nodes -->
  <circle cx="32" cy="10" r="2.2" fill="#34d399" filter="url(#glow)" />
  <circle cx="51.5" cy="23.5" r="2.2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="47.5" cy="45" r="2.2" fill="#34d399" filter="url(#glow)" />
  <circle cx="16.5" cy="45" r="2.2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="12.5" cy="23.5" r="2.2" fill="#34d399" filter="url(#glow)" />

  <!-- Center Core AI Node -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="1.5" fill="#10b981" />
</svg>
